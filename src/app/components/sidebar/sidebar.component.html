<div *ngIf="isMobileOpen" 
     class="fixed inset-0 bg-black/50 z-20 md:hidden transition-opacity duration-300"
     (click)="closeMobileSidebar.emit()"></div>

<aside class="bg-white text-gray-700 flex flex-col transition-all duration-300 ease-in-out fixed h-full shadow-lg z-30"
       [ngClass]="{ 
         'w-60': !isCollapsed, 
         'w-20': isCollapsed,
         'md:translate-x-0': true,
         'translate-x-0': isMobileOpen,
         '-translate-x-full': !isMobileOpen,
         'md:-translate-x-0': !isMobileOpen
       }">
  
  <div class="flex items-center justify-center h-20 border-b border-gray-200 mx-4">
    <img src="assets/images/paylink.png" alt="PayLink Logo" 
         [ngClass]="{ 'h-10': !isCollapsed, 'h-8': isCollapsed }" class="w-auto transition-all duration-300">
  </div>

  <div class="px-4 mt-4">
      <nav class="space-y-2">
        <a routerLink="/dashboard" routerLinkActive="text-[#222D8E] font-semibold bg-slate-100 border-l-4 border-primary" class="flex items-center p-3 rounded-lg hover:bg-slate-100 transition-colors" (click)="onMobileNavClick()">
          <fa-icon [icon]="faHome" class="h-6 w-6 flex-shrink-0"></fa-icon>
          <span class="font-medium whitespace-nowrap transition-all duration-200" [ngClass]="{ 'ml-4 opacity-100': !isCollapsed, 'w-0 opacity-0': isCollapsed }">Dashboard</span>
        </a>
      </nav>
  </div>

  <div class="px-4">
    <p class="pt-6 pb-2 pl-3 text-xs font-semibold text-gray-400 uppercase tracking-wider" [ngClass]="{'opacity-100': !isCollapsed, 'opacity-0': isCollapsed}">transactions</p>
      <nav class="space-y-2">
        <a routerLink="/reports" routerLinkActive="text-[#222D8E] font-semibold bg-slate-100 border-l-4 border-primary" class="flex items-center p-3 rounded-lg hover:bg-slate-100 transition-colors" (click)="onMobileNavClick()">
          <fa-icon [icon]="faList" class="h-6 w-6 flex-shrink-0"></fa-icon>
          <span class="font-medium whitespace-nowrap transition-all duration-200" [ngClass]="{ 'ml-4 opacity-100': !isCollapsed, 'w-0 opacity-0': isCollapsed }">Reports</span>
        </a>

        <a routerLink="/payment-link" routerLinkActive="text-[#222D8E] font-semibold bg-slate-100 border-l-4 border-primary" class="flex items-center p-3 rounded-lg hover:bg-slate-100 transition-colors" (click)="onMobileNavClick()">
          <fa-icon [icon]="faLink" class="h-6 w-6 flex-shrink-0"></fa-icon>
          <span class="font-medium whitespace-nowrap transition-all duration-200" [ngClass]="{ 'ml-4 opacity-100': !isCollapsed, 'w-0 opacity-0': isCollapsed }">Payment Link</span>
        </a>

        <a routerLink="/payment-link" routerLinkActive="text-[#222D8E] font-semibold bg-slate-100 border-l-4 border-primary" class="flex items-center p-3 rounded-lg hover:bg-slate-100 transition-colors" (click)="onMobileNavClick()">
          <fa-icon [icon]="faBell" class="h-6 w-6 flex-shrink-0"></fa-icon>
          <span class="font-medium whitespace-nowrap transition-all duration-200" [ngClass]="{ 'ml-4 opacity-100': !isCollapsed, 'w-0 opacity-0': isCollapsed }">Notifications</span>
        </a>
      </nav>
  </div>

  <div class="px-4">
    <p class="pt-6 pb-2 pl-3 text-xs font-semibold text-gray-400 uppercase tracking-wider" [ngClass]="{'opacity-100': !isCollapsed, 'opacity-0': isCollapsed}">data</p>
      <nav class="space-y-2">
        <a routerLink="/customers" routerLinkActive="text-[#222D8E] font-semibold bg-slate-100 border-l-4 border-primary" class="flex items-center p-3 rounded-lg hover:bg-slate-100 transition-colors" (click)="onMobileNavClick()">
          <fa-icon [icon]="faPeopleGroup" class="h-6 w-6 flex-shrink-0"></fa-icon>
          <span class="font-medium whitespace-nowrap transition-all duration-200" [ngClass]="{ 'ml-4 opacity-100': !isCollapsed, 'w-0 opacity-0': isCollapsed }">Customers</span>
        </a>

        <a routerLink="/items" routerLinkActive="text-[#222D8E] font-semibold bg-slate-100 border-l-4 border-primary" class="flex items-center p-3 rounded-lg hover:bg-slate-100 transition-colors" (click)="onMobileNavClick()">
          <fa-icon [icon]="faBoxesStacked" class="h-6 w-6 flex-shrink-0"></fa-icon>
          <span class="font-medium whitespace-nowrap transition-all duration-200" [ngClass]="{ 'ml-4 opacity-100': !isCollapsed, 'w-0 opacity-0': isCollapsed }">Items</span>
        </a>
      </nav>
  </div>

  <div class="flex-1 flex flex-col overflow-y-auto">  
    <div class="mt-auto py-6 border-t border-gray-200 space-y-2 mx-4">
      <p class="pt-6 pb-2 pl-3 text-xs font-semibold text-gray-400 uppercase tracking-wider" [ngClass]="{'opacity-100': !isCollapsed, 'opacity-0': isCollapsed}">Others</p>
      <a routerLink="/settings" routerLinkActive="text-[#222D8E] font-semibold bg-slate-100 border-l-4 border-primary" class="flex items-center p-3 rounded-lg hover:bg-slate-100 transition-colors" (click)="onMobileNavClick()">
        <fa-icon [icon]="faCog" class="h-6 w-6 flex-shrink-0"></fa-icon>
        <span class="font-medium whitespace-nowrap transition-all duration-200" [ngClass]="{ 'ml-4 opacity-100': !isCollapsed, 'w-0 opacity-0': isCollapsed }">Settings</span>
      </a>
      <button (click)="logout()" class="w-full flex items-center p-3 rounded-lg text-red-500 hover:bg-red-50 transition-colors">
        <fa-icon [icon]="faSignOutAlt" class="h-6 w-6 flex-shrink-0"></fa-icon>
        <span class="font-medium whitespace-nowrap transition-all duration-200" [ngClass]="{ 'ml-4 opacity-100': !isCollapsed, 'w-0 opacity-0': isCollapsed }">Log out</span>
      </button>
    </div>
  </div>

  <div class="absolute top-1/35 -right-4 z-10 hidden md:block">
    <button (click)="toggleSidebar.emit()" class="bg-blue-900 text-white w-8 h-8 rounded-full flex items-center justify-center focus:outline-none shadow-md hover:bg-primary-dark">
      <fa-icon [icon]="faChevronLeft" class="transition-transform duration-300" [ngClass]="{ 'rotate-180': isCollapsed }"></fa-icon>
    </button>
  </div>
</aside>

<div *ngIf="isLogoutModalOpen" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-lg w-full max-w-md">
    <div class="p-6">
      <div class="flex items-start">
        <div class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-red-100 sm:mx-0 sm:h-10 sm:w-10">
          <fa-icon [icon]="faExclamationTriangle" class="h-6 w-6 text-red-600 pl-0.5"></fa-icon>
        </div>
        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
          <h3 class="text-lg leading-6 font-bold text-gray-900">Logout Confirmation</h3>
          <div class="mt-2">
            <p class="text-sm text-gray-500">Do you want to logout?</p>
          </div>
        </div>
      </div>
    </div>
    <div class="bg-slate-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse rounded-b-xl">
      <button (click)="confirmLogout()" type="button" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-red-600 text-base font-medium text-white hover:bg-red-700 sm:ml-3 sm:w-auto sm:text-sm">
        <span>Yes</span>
      </button>
      <button (click)="closeLogoutModal()" type="button" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 sm:mt-0 sm:w-auto sm:text-sm">
        No
      </button>
    </div>
  </div>
</div>
