<div class="min-h-screen font-sans md:grid md:grid-cols-2">


    <div class="hidden md:flex flex-col items-center justify-center bg-slate-50 p-12">
        <img src="assets/images/paylink.png" alt="PayLink Logo" class="w-auto h-30">
    </div>

    <div class="flex flex-col items-center justify-center bg-white p-8">

        <div class="md:hidden flex flex-col items-center justify-center mb-8">
            <img src="assets/images/paylink.png" alt="PayLink Logo" class="w-auto h-14">
        </div>

        <div class="w-full max-w-sm">
            <h2 class="text-xl font-bold text-gray-800 mb-6 text-center md:text-left">Login to your account</h2>

            <form [formGroup]="loginForm" (ngSubmit)="login()">
                <div class="mb-4">
                    <label for="email" class="block text-sm font-bold text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" placeholder="example@mail.com"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary placeholder:text-gray-400"
                        formControlName="email">

                    <div *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="text-red-600 text-sm mt-1">
                        <div *ngIf="email?.errors?.['required']">Email cannot be empty</div>
                        <div *ngIf="email?.errors?.['email']">Invalid email format</div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="block text-sm font-bold text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <input [type]="passwordVisible ? 'text' : 'password'" id="password" placeholder="••••••••••"
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary placeholder:text-gray-400"
                            formControlName="password">

                        <button type="button" (click)="togglePasswordVisibility()"
                            class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 hover:text-gray-700">
                            <fa-icon [icon]="passwordVisible ? faEye : faEyeSlash" class="h-5 w-5"></fa-icon>
                        </button>
                    </div>
                    <div *ngIf="password?.invalid && (password?.dirty || password?.touched)"
                        class="text-red-600 text-sm mt-1">
                        <div *ngIf="password?.errors?.['required']">Password cannot be empty</div>
                    </div>
                </div>

                <div class="text-right mb-6">
                    <a href="/forgot-password" class="text-sm text-indigo-600 hover:underline">Forgot Password?</a>
                </div>

                <button type="submit" [disabled]="loginForm.invalid || isLoading"
                    class="w-full py-3 px-4 bg-blue-900 text-white font-semibold rounded-md transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                    <span *ngIf="!isLoading">Login</span>
                    <span *ngIf="isLoading" class="flex items-center justify-center">
                        <fa-icon [icon]="faSpinner" class="mr-2 spinner-animation"></fa-icon>
                        <span>Loading...</span>
                    </span>
                </button>
            </form>
            <button
                class="mt-4 w-full py-3 px-4 bg-white text-black font-semibold rounded-md transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary border border-blue-900">
                <span *ngIf="!isRegister">Register</span>
                <span *ngIf="isRegister" class="flex items-center justify-center">
                    <fa-icon [icon]="faSpinner" class="mr-2 spinner-animation"></fa-icon>
                    <span>Loading...</span>
                </span>
            </button>
        </div>
    </div>

</div>
